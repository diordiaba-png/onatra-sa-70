<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contrôle carte — PORT DE KINSHASA</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body><header><div class="brand"><img class="brand-logo" src="assets/logo-onatra.png" alt="Logo ONATRA"><div><small>ONATRA S.A 70 · PORT DE KINSHASA</small><h1>Contrôle d’accès</h1><p>Vérification sécurisée par QR code</p></div></div><nav><a href="controle.html">Scanner QR</a><a href="index.html">Cartes</a></nav></header><main><section class="panel"><h2>Résultat du contrôle</h2><div id="result">Connexion requise pour enregistrer ce contrôle.</div><p id="notice" class="notice" hidden></p></section><section class="panel" id="loginPanel"><h2>Connexion de l’agent de contrôle</h2><p>Le contrôle sera enregistré avec votre compte.</p><form id="loginForm" class="grid"><label>Identifiant<input class="form-control" name="username" required autocomplete="username"></label><label>Mot de passe<input class="form-control" type="password" name="password" required autocomplete="current-password"></label><div class="full"><button class="primary btn">Se connecter et vérifier</button></div></form><p id="loginError" class="notice error" hidden></p></section></main><footer>PORT DE KINSHASA · ONATRA S.A 70</footer><script>
const API='/.netlify/functions/api',id=new URLSearchParams(location.search).get('id'),$=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opts={}){const r=await fetch(API+path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'Erreur serveur.');return d}function render(d){$('#result').innerHTML=`<div class="status ${d.allowed?'valid':'invalid'}">${d.allowed?'ACCÈS AUTORISÉ':'ACCÈS REFUSÉ'}</div><h3>${esc(d.card?.number||'Carte inconnue')}</h3><p><b>État :</b> ${esc(d.state)}</p>${d.card?`<p><b>Type :</b> ${esc(d.card.type)}</p><p><b>Titulaire :</b> ${esc(d.card.person)}</p><p><b>Société / service :</b> ${esc(d.card.company)}</p>`:''}<p><b>Date/heure :</b> ${esc(new Date(d.checkedAt).toLocaleString('fr-FR'))}</p><p><b>Agent :</b> ${esc(d.checkedBy)}</p>`}$('#loginForm').addEventListener('submit',async e=>{e.preventDefault();if(!id){$('#loginError').hidden=false;$('#loginError').textContent='QR code sans identifiant de carte.';return}const f=new FormData(e.target);try{await api('/login',{method:'POST',body:JSON.stringify({username:f.get('username'),password:f.get('password')})});const d=await api('/scan',{method:'POST',body:JSON.stringify({id})});render(d);$('#loginPanel').hidden=true}catch(err){$('#loginError').hidden=false;$('#loginError').textContent=err.message}});</script></body></html>
